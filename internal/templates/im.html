{{ define "im.html" }}
<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quick IM · 控制台</title><style>
:root{font-family:Inter,"Microsoft YaHei",system-ui;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b0e16;color:#edf0fa}.layout{max-width:1180px;margin:auto;padding:28px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.badge{padding:6px 10px;border-radius:999px;background:#262c42;color:#bfcaff;font-size:13px}.grid{display:grid;grid-template-columns:280px 1fr 1fr;gap:16px;margin-top:24px}.card{padding:18px;border:1px solid #292f45;border-radius:16px;background:#131722}.label{display:block;margin:12px 0 7px;color:#9ea7c0;font-size:13px}.state{color:#ff9fa8}.state.online{color:#75dfaa}.log,.list{height:405px;overflow:auto;margin:0;padding:10px;border-radius:10px;background:#090b12;color:#cbd2e8;font:13px/1.7 ui-monospace,Consolas,monospace;white-space:pre-wrap}.conversation{width:100%;margin:0 0 7px;padding:10px;border:1px solid #343b55;border-radius:8px;background:#171b29;color:#edf0fa;text-align:left}.conversation small{display:block;color:#9ea7c0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.unread{float:right;background:#ff7186;color:#240b10;border-radius:999px;padding:1px 6px}input,textarea{width:100%;padding:10px;border:1px solid #343b55;border-radius:9px;outline:0;background:#0d101a;color:#fff;font:inherit}textarea{min-height:86px;resize:vertical}button{margin:12px 7px 0 0;padding:9px 12px;border:0;border-radius:9px;background:#7c8dff;color:#10152b;font-weight:700;cursor:pointer}.secondary{background:#323951;color:#e7eaff}#notice{min-height:20px;margin:10px 0 0}.success{color:#75dfaa}.error{color:#ff9fa8}@media(max-width:850px){.grid{grid-template-columns:1fr}.list,.log{height:220px}}
</style></head><body><main class="layout"><header class="top"><div><span class="badge">Quick IM · Day 6/7</span><h1>你好，{{ .username }}</h1><p>会话列表、未读数、历史消息与可靠 WebSocket 连接。</p></div><div><span class="state" id="status">连接中…</span><button class="secondary" id="logout">退出</button></div></header><section class="grid"><aside class="card"><h2>最近会话</h2><button class="secondary" id="reload-conversations">刷新</button><div class="list" id="conversations"></div></aside><article class="card"><h2>单聊</h2><label class="label" for="peer">对方用户名</label><input id="peer" maxlength="32" placeholder="例如 bob"><button class="secondary" id="history" type="button">加载历史</button><button class="secondary" id="read" type="button">标记已读</button><form id="send-form"><label class="label" for="content">消息内容</label><textarea id="content" required maxlength="2000"></textarea><button type="submit">发送并落库</button></form><p id="notice" role="status"></p></article><article class="card"><h2>消息与连接事件</h2><pre class="log" id="log"></pre></article></section></main><script>
const status=document.querySelector('#status'),log=document.querySelector('#log'),peer=document.querySelector('#peer'),content=document.querySelector('#content'),notice=document.querySelector('#notice'),conversations=document.querySelector('#conversations');let socket;const api=(url,options={})=>fetch(url,options).then(async res=>{const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'请求失败');return data});function write(v){log.textContent+=`[${new Date().toLocaleTimeString()}] ${v}\n`;log.scrollTop=log.scrollHeight}function currentPeer(){const value=peer.value.trim();if(!value)throw new Error('请先填写对方用户名');return value}async function loadHistory(){const data=await api(`/api/messages/history?peer=${encodeURIComponent(currentPeer())}`);write(`history (${data.data.length})`);data.data.slice().reverse().forEach(m=>write(`${m.from_user} → ${m.to_user}: ${m.content}`))}async function loadConversations(){const data=await api('/api/conversations');conversations.innerHTML='';data.data.forEach(item=>{const button=document.createElement('button');button.className='conversation';button.innerHTML=`<b>${item.peer}</b>${item.unread?`<span class="unread">${item.unread}</span>`:''}<small>${item.last_content}</small>`;button.onclick=()=>{peer.value=item.peer;loadHistory().catch(showError)};conversations.append(button)});if(!data.data.length)conversations.textContent='暂无会话'}function showError(err){notice.className='error';notice.textContent=err.message}function connect(){const protocol=location.protocol==='https:'?'wss':'ws';socket=new WebSocket(`${protocol}://${location.host}/ws`);socket.onopen=()=>{status.textContent='WebSocket 已连接';status.classList.add('online');write('connected')};socket.onmessage=e=>{write(`received: ${e.data}`);loadConversations().catch(()=>{})};socket.onclose=()=>{status.textContent='WebSocket 已断开';status.classList.remove('online');write('closed')}}
document.querySelector('#send-form').addEventListener('submit',async e=>{e.preventDefault();notice.className='';try{const data=await api('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to_user:currentPeer(),content:content.value.trim()})});notice.className='success';notice.textContent=`已保存消息 ${data.data.msg_id}`;content.value='';write(`sent to ${data.data.to_user}: ${data.data.content}`);loadConversations().catch(()=>{})}catch(err){showError(err)}});document.querySelector('#history').onclick=()=>loadHistory().catch(showError);document.querySelector('#read').onclick=async()=>{try{await api('/api/messages/read',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({peer:currentPeer()})});notice.className='success';notice.textContent='该会话未读数已清零';loadConversations().catch(()=>{})}catch(err){showError(err)}};document.querySelector('#reload-conversations').onclick=()=>loadConversations().catch(showError);document.querySelector('#logout').onclick=async()=>{await fetch('/auth/logout',{method:'POST'});localStorage.removeItem('quick_im_token');location.assign('/auth/login')};connect();loadConversations().catch(showError);
</script></body></html>
{{ end }}
